plugins {
    id 'java'
}

group = 'csse3030'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.14.4'
    jazzerVersion = '0.30.0'
    h2Version = '2.5.252'
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Jazzer: coverage-guided fuzzing as JUnit tests (Parts 3-5)
    testImplementation "com.code-intelligence:jazzer-junit:${jazzerVersion}"

    // In-memory database for StudentDao (Part 4)
    testRuntimeOnly "com.h2database:h2:${h2Version}"
}

test {
    useJUnitPlatform()
}

// Show each test's name and result, and the full exception (with cause) for failures.
tasks.withType(Test).configureEach {
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// --- Fuzzing tasks -----------------------------------------------------------

// Each task fuzzes ONE Jazzer fuzz target for real. A plain `./gradlew test` leaves
// JAZZER_FUZZ unset, so Jazzer only replays saved inputs (regression mode) and finishes
// quickly.
def registerFuzz = { String name, String desc, String className ->
    tasks.register(name, Test) {
        group = 'fuzzing'
        description = desc
        useJUnitPlatform()
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        include "csse3030/week11/${className}.class"
        environment 'JAZZER_FUZZ', '1'
        // Fuzzing is nondeterministic and has no declared inputs: never skip as up-to-date.
        outputs.upToDateWhen { false }
        // Backstop only. Fuzz targets set @FuzzTest(maxDuration = ...); a @FuzzTest with no
        // maxDuration would otherwise run for Jazzer's default of 5 minutes.
        timeout = Duration.ofMinutes(3)
    }
}

registerFuzz('fuzzFirstWord', 'Part 3: fuzz Words.firstWord (about 30 s)', 'FirstWordFuzzTest')
registerFuzz('fuzzQuantity', 'Part 3: fuzz QuantityParser.parseQuantity (about 30 s)', 'QuantityFuzzTest')
registerFuzz('fuzzUrlCodec', 'Part 4: fuzz UrlCodec.decode (about 60 s)', 'UrlCodecFuzzTest')
registerFuzz('fuzzTicket', 'Part 4: fuzz TicketParser.parse (about 60 s)', 'TicketParserFuzzTest')
registerFuzz('fuzzStudentDao', 'Part 5: fuzz StudentDao.findNamesById (about 60 s)', 'StudentDaoFuzzTest')
