plugins {
    id 'java'
}

group = 'csse3030'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.14.4'
    jazzerVersion = '0.30.0'
    h2Version = '2.5.252'
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Jazzer: coverage-guided fuzzing as JUnit tests (Parts 3-5)
    testImplementation "com.code-intelligence:jazzer-junit:${jazzerVersion}"

    // In-memory database for StudentDao (Part 4)
    testRuntimeOnly "com.h2database:h2:${h2Version}"
}

test {
    useJUnitPlatform()
}

// Show each test's name and result, and the full exception (with cause) for failures.
tasks.withType(Test).configureEach {
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// --- Per-part tasks ----------------------------------------------------------

// Plain JUnit tests (no Jazzer fuzzing).
def registerPlain = { String name, String desc, List<String> classNames ->
    tasks.register(name, Test) {
        group = 'verification'
        description = desc
        useJUnitPlatform()
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        classNames.each { include "csse3030/week11/${it}.class" }
        // Show the fuzzers' printed summaries (valid / rejected counts and so on).
        testLogging.showStandardStreams = true
    }
}

// Jazzer tests in FUZZING mode. A plain `./gradlew test` leaves JAZZER_FUZZ unset, so
// Jazzer only replays saved inputs (regression mode) and finishes quickly.
def registerFuzz = { String name, String desc, List<String> classNames ->
    tasks.register(name, Test) {
        group = 'verification'
        description = desc
        useJUnitPlatform()
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        classNames.each { include "csse3030/week11/${it}.class" }
        environment 'JAZZER_FUZZ', '1'
        // Fuzzing is nondeterministic and has no declared inputs: never skip as up-to-date.
        outputs.upToDateWhen { false }
    }
}

registerPlain('testQ2', 'Part 2: random and mutation fuzzers, TicketParser regression tests',
        ['RandomFuzzerTest', 'MutationFuzzerTest', 'TicketParserRegressionTest'])
registerFuzz('testQ3', 'Part 3: Jazzer fuzzing of UrlCodec (about 60 s)',
        ['UrlCodecFuzzTest', 'UrlCodecRegressionTest'])
registerFuzz('testQ4', 'Part 4: StudentDao unit tests and Jazzer fuzzing (about 60 s)',
        ['StudentDaoTest', 'StudentDaoFuzzTest'])
registerFuzz('testQ5', 'Part 5: Jazzer fuzzing of TicketParser (about 60 s)',
        ['TicketParserFuzzTest', 'TicketParserRegressionTest'])
